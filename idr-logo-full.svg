<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="topFace2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B1A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E8520A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="leftFace2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#C43D00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B03400;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="rightFace2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E05010;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#CC4400;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Isometric cube (left-aligned, compact) -->
  <polygon points="40,8 68,24 40,40 12,24" fill="url(#topFace2)"/>
  <polygon points="12,24 40,40 40,68 12,52" fill="url(#leftFace2)"/>
  <polygon points="68,24 40,40 40,68 68,52" fill="url(#rightFace2)"/>
  <polyline points="40,8 40,40" stroke="rgba(255,255,255,0.25)" stroke-width="1" fill="none"/>
  <polyline points="12,24 68,24" stroke="rgba(255,255,255,0.15)" stroke-width="1" fill="none"/>
  <line x1="52" y1="36" x2="58" y2="58" stroke="#FF8C3A" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>

  <!-- IDR wordmark -->
  <text x="84" y="33" font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-weight="700" font-size="28" letter-spacing="3" fill="#111111">IDR</text>

  <!-- Divider -->
  <rect x="84" y="40" width="48" height="1.5" fill="#FF6B1A"/>

  <!-- Full name -->
  <text x="84" y="57" font-family="'Barlow', 'Arial', sans-serif" font-weight="400" font-size="11" letter-spacing="1.5" fill="#444444">INSTITUTE OF DIGITAL RISK</text>
</svg>
