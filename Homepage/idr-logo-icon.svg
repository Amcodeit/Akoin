<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <linearGradient id="topFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B1A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E8520A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="leftFace" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#C43D00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B03400;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="rightFace" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E05010;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#CC4400;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Isometric cube -->
  <!-- Top face -->
  <polygon points="40,8 68,24 40,40 12,24" fill="url(#topFace)"/>
  <!-- Left face -->
  <polygon points="12,24 40,40 40,68 12,52" fill="url(#leftFace)"/>
  <!-- Right face -->
  <polygon points="68,24 40,40 40,68 68,52" fill="url(#rightFace)"/>

  <!-- Shield overlay / cut-out diagonal to suggest risk/resilience -->
  <!-- Inner highlight line on top face -->
  <polyline points="40,8 40,40" stroke="rgba(255,255,255,0.25)" stroke-width="1" fill="none"/>
  <polyline points="12,24 68,24" stroke="rgba(255,255,255,0.15)" stroke-width="1" fill="none"/>

  <!-- Warning/risk accent: small diagonal slash on right face -->
  <line x1="52" y1="36" x2="58" y2="58" stroke="#FF8C3A" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
</svg>
